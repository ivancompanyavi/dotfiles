packages:
  darwin:
    taps:
      - 'jesseduffield/lazygit'
      - 'FelixKratz/formulae'
    brews:
    - 'git'
    - 'cmake'
    - 'coreutils'
    - 'fd'
    - 'fzf'
    - 'gcalcli'
    - 'starship'
    - 'lua'
    - 'lua-language-server'
    - 'basedpyright'
    - 'neovim'
    - 'ruff'
    - 'ripgrep'
    - 'stylua'
    - 'tree-sitter-cli'
    - 'typescript-language-server'
    - 'wget'
    - 'jesseduffield/lazygit/lazygit'
    - 'sketchybar'
    - 'borders'
    casks:
    # NB: swappable app casks (browser, terminal, editor) live in apps.yaml
    # (.apps.<x>.cask) so each app's whole definition stays in one place; the
    # install template pulls them in. Only non-app casks remain here.
    - 'font-fira-code'
    - 'font-hack-nerd-font'
    - 'nikitabobko/tap/aerospace'
  # Arch Linux + Hyprland. `pacman` = official repos; `aur` = built with paru,
  # which the install script bootstraps if missing. Swappable apps (browser,
  # terminal, editor) come from apps.yaml's `linux` blocks, not from here.
  linux:
    pacman:
    # Base tooling
    - 'base-devel'
    - 'git'
    - 'git-lfs'
    - 'github-cli'
    - 'chezmoi'
    - 'zsh'
    - 'cmake'
    - 'jq'
    - 'python'
    - 'wget'
    - 'wl-clipboard'
    # CLI tools (mirrors the darwin brews)
    - 'fd'
    - 'fzf'
    - 'ripgrep'
    - 'starship'
    - 'lazygit'
    - 'mise'
    - 'neovim'
    - 'tree-sitter-cli'
    - 'nodejs'
    - 'npm'
    # Language servers and formatters
    - 'lua'
    - 'lua-language-server'
    - 'typescript-language-server'
    - 'gopls'
    - 'ruff'
    - 'stylua'
    # Fonts
    - 'ttf-fira-code'
    - 'ttf-hack-nerd'
    - 'noto-fonts'
    - 'noto-fonts-emoji'
    # Desktop: Hyprland and the pieces around it
    - 'hyprland'
    - 'hyprpaper'
    - 'hyprpolkitagent'
    - 'hyprpicker'
    - 'hyprsunset'
    - 'xdg-desktop-portal-hyprland'
    - 'xdg-desktop-portal-gtk'
    - 'waybar'
    - 'fuzzel'
    - 'swaync'
    - 'darkman'
    - 'grim'
    - 'slurp'
    - 'satty'
    - 'cliphist'
    - 'adw-gtk-theme'
    - 'qt5-wayland'
    - 'qt6-wayland'
    aur:
    - 'basedpyright'
    - 'gcalcli'
    - 'terraform-ls'
